<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo app</title>
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="app">
        <header>
            <h1><i class="fas fa-check-circle"></i>My Tasks</h1>
            <p id="date">7/1/2027</p>
        </header>

        <div class="todo-container">
            <input type="text" id="todo-input" placeholder="Enter youre Tasks here...">
            <button id="add-BTN"><i class="fas fa-plus"></i></button>
        </div>

        <div class="filters">
            <span class="filter active" data-filter="All">All</span>
            <span class="filter" data-filter="Active">Active</span>
            <span class="filter" data-filter="Completed">Completed</span>
        </div>

        <div class="todolist-container">
            <ul class="todolist">

                <!--<li class="todo-item">
                    <label class="checkbox-container">
                        <input type="checkbox" class="todo-checkbox">
                        <span class="checkmark"></span>
                    </label>
                    <span class="todo checked">learn python</span>
                    <button class="delete-btn"><i class="fas fa-times"></i></button>
              </li>-->

              <div class="no-list">
                    <i class="fas fa-clipboard-list"></i>
                    <p>No Tasks here Yet</p>
                </div>

            </ul>
            
        </div>

        <footer>
            <p id="items-left">2 items left</p>
            <button id="clear-completed">Clear Completed</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
